# Configurazione di Frankie Proxy Core.
mysql:
  host: "localhost"
  port: 3306
  database: "frankie"
  username: "root"
  password: ""
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 5000
    max-lifetime: 1800000

# Sistema di report (/report <giocatore> <motivo>).
report:
  cooldown-seconds: 60

# Sistema di richieste allo staff (/request <motivo>).
request:
  cooldown-seconds: 60

# Sistema amici (/friend).
friends:
  max-friends: 50